[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/producer",
    "crates/consumer",
    "crates/transactions",
    "crates/observability",
    "crates/cli",
]

[workspace.dependencies]
tokio       = { version = "1",   features = ["full"] }
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"
bytes       = { version = "1", features = ["serde"] }
tracing     = "0.1"
thiserror   = "2"
anyhow      = "1"
