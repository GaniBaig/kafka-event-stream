version: "3.8"

services:

  # ─── Kafka broker with both PLAINTEXT and SSL listeners ───────────────────
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka
    container_name: kafka-ssl
    ports:
      - "9092:9092"     # Plaintext (development)
      - "9093:9093"     # SSL / mTLS (the demo port)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      # Two client-facing listeners: PLAINTEXT on 9092, SSL on 9093
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,SSL://0.0.0.0:9093,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,SSL://localhost:9093,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,SSL:SSL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      # SSL configuration — paths are relative to /etc/kafka/secrets/ inside the container
      KAFKA_SSL_KEYSTORE_FILENAME: "broker.keystore.jks"
      KAFKA_SSL_KEYSTORE_CREDENTIALS: "ssl_credentials"
      KAFKA_SSL_KEY_CREDENTIALS: "ssl_credentials"
      KAFKA_SSL_TRUSTSTORE_FILENAME: "broker.truststore.jks"
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: "ssl_credentials"
      # required = broker verifies client certificate (mutual TLS)
      KAFKA_SSL_CLIENT_AUTH: "required"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_ssl_data:/var/lib/kafka/data
      # Mount generated certs into the broker's secrets directory.
      # Run scripts/gen-certs.sh first to populate certs/.
      - ../certs/:/etc/kafka/secrets/
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus-ssl
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - kafka

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana-ssl
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    depends_on:
      - prometheus

volumes:
  kafka_ssl_data:
